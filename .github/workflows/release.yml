name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PROJECT: src/NotchCalagopus/NotchCalagopus.csproj
  ZIP_NAME: notch-calagopus.zip

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The plugin compiles against Notch.Core.dll, which is not on NuGet. API version 4
      # (page back button and list) ships in Notch v0.6.1.
      - uses: actions/checkout@v4
        with:
          repository: Brick-Bread/WNotch
          ref: v0.6.1
          path: notch
      - run: dotnet build notch/src/Notch.Core -c Release -o notch-core

      - run: dotnet test -p:NotchCorePath=${{ github.workspace }}\notch-core\Notch.Core.dll
        shell: pwsh

      - run: dotnet publish $env:PROJECT -c Release -o dist -p:NotchCorePath=${{ github.workspace }}\notch-core\Notch.Core.dll
        shell: pwsh

      - name: Zip and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Remove-Item dist\*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath $env:ZIP_NAME
          gh release create $env:GITHUB_REF_NAME $env:ZIP_NAME --title $env:GITHUB_REF_NAME --generate-notes
